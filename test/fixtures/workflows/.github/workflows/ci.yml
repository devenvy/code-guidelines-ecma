# Smallest ci.yml that satisfies `code-guidelines check`.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  pr-title:
    steps:
      - uses: amannn/action-semantic-pull-request@v6
  lint:
    steps:
      - run: pnpm run guidelines:check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run knip
      - uses: raven-actions/actionlint@v2
      - uses: zizmorcore/zizmor-action@v0
  test:
    steps:
      - run: pnpm run test:ci
  build:
    steps:
      - run: pnpm pack
  audit:
    steps:
      - run: pnpm audit --prod
  dependency-review:
    steps:
      - uses: actions/dependency-review-action@v5
  dependabot-auto-merge:
    steps:
      - run: gh pr merge --auto --squash
  result:
    if: always()
    needs: [pr-title, lint, test, build, audit, dependency-review]
    steps:
      - run: 'true'
