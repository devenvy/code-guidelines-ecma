name: CI

# Same layout as consumer repos: lint, test, build, audit, dependency-review,
# repo-specific jobs (here: rules and the Dependabot rule decisions), Dependabot auto-merge, and
# result as the single required status check.
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run guidelines:check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run knip
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false # fail the job on findings instead of uploading SARIF

  # Includes the pack smoke test (installs the tarball into fresh consumer projects). Windows
  # runs too: the CLI writes files and must keep line endings and paths right there.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
            coverage-report: true
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # coverage summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      # Dependabot and fork PRs get a read-only token and cannot comment; the coverage
      # thresholds in the test run are the gate either way.
      - name: Coverage report
        if: >-
          ${{ matrix.coverage-report && github.event_name == 'pull_request' && !cancelled()
          && github.actor != 'dependabot[bot]'
          && !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0

  # The published artifact: prepack builds the type declarations, then publint and
  # are-the-types-wrong check the packed tarball's exports and types.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:package

  # New advisories in unrelated packages must not block PRs; they fail main and the weekly run.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  # Fails a PR that adds a dependency with a known vulnerability (any severity) or a license
  # outside the allow-list. Only changes in the PR count, so unrelated advisories never block.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          allow-licenses: >-
            MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            CC0-1.0, CC-BY-4.0, MPL-2.0, Unlicense, Python-2.0

  # Every rule of every bundled plugin must be decided in src/eslint/rules, and any change to the
  # effective configuration must be reviewed as a snapshot diff. On a Dependabot plugin bump it
  # fails until dependabot-rules-commit adds the new rules.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rule inventory and effective-config snapshots
        run: pnpm exec vitest run test/rule-inventory.test.mjs test/effective-config.test.mjs --coverage.enabled=false

  # Dependabot PRs: decides the rules new plugin versions add (`rules:add`: on as error, Prettier's
  # formatting rules off) and refreshes the effective-config snapshots. This job runs the updated
  # packages, so it holds no write access; dependabot-rules-commit commits its patch.
  dependabot-rules:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run rules:add
      - run: pnpm exec vitest run test/effective-config.test.mjs --update --coverage.enabled=false
      - id: diff
        run: |
          git diff --binary -- src/eslint/rules test/__snapshots__ > rules.patch
          if [ -s rules.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules-patch
          path: rules.patch
          if-no-files-found: error

  # Commits dependabot-rules' patch to the PR as devenvy-bot, which re-runs CI (a GITHUB_TOKEN push
  # would not). Runs nothing from the repository or its dependencies, and applies the patch only
  # if it touches the rule tables and snapshots alone.
  dependabot-rules-commit:
    needs: dependabot-rules
    if: needs.dependabot-rules.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # pushing to the Dependabot branch
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rules-patch
          path: ${{ runner.temp }}/rules
      - name: Commit the rule decisions to the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PATCH: ${{ runner.temp }}/rules/rules.patch
        run: |
          for file in $(git apply --numstat "$PATCH" | cut -f3); do
            case "$file" in
              src/eslint/rules/*.mjs | test/__snapshots__/*.snap) ;;
              *) echo "::error::the patch changes $file"; exit 1 ;;
            esac
          done
          git apply "$PATCH"
          user_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git add -- src/eslint/rules test/__snapshots__
          git -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "chore: decide the rules new plugin versions add (on until turned off)"
          # fails if Dependabot moved the branch meanwhile; the run for the new head decides again
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"

  # Dependabot PRs merge themselves once the required check passes (a plugin bump that adds rules
  # passes once dependabot-rules-commit has added them). Runs as the devenvy-bot app so the merge triggers release.yml.
  # Needs the org Dependabot secrets DEVENVY_BOT_CLIENT_ID and DEVENVY_BOT_PRIVATE_KEY.
  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # enabling auto-merge
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash

  # Single required status check.
  result:
    if: always()
    needs: [lint, test, build, audit, dependency-review, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          AUDIT: ${{ needs.audit.result }}
          RULES: ${{ needs.rules.result }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        # dependency-review only runs on pull requests; the audit is informational there
        run: |
          for result in "$LINT" "$TEST" "$BUILD" "$RULES"; do test "$result" = "success"; done
          if [ "$IS_PR" = "true" ]; then
            test "$DEPENDENCY_REVIEW" = "success"
          else
            test "$AUDIT" = "success"
          fi
