name: Release

# Every push to main updates the release PR (release-please) and enables auto-merge on it, so a
# merged feat:/fix: PR is released once the release PR's CI passes. When the release PR merges,
# this run re-runs CI on the release commit, publishes to npm with trusted publishing, attests
# the tarball's build provenance and attaches the tarball and an SPDX SBOM to the release.
# release-please runs as the devenvy-bot app (org variable DEVENVY_BOT_CLIENT_ID, org secret
# DEVENVY_BOT_PRIVATE_KEY) so its pull requests get CI; GITHUB_TOKEN ones would not.
#
# The npm trusted publisher is bound to this file name (release.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # release PRs, tags, releases and their labels
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the pending release PR once its CI passes
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # the PR release-please just created or updated; the label search can lag behind a new PR
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr=$(jq -r '.number // empty' <<< "${RELEASE_PR:-null}")
          if [ -z "$pr" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json number --jq '.[0].number // empty')
          fi
          if [ -n "$pr" ]; then gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash; fi

  ci:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write # ci.yml's test job declares it (used only for PR coverage comments)

  publish:
    needs: [release-please, ci]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), npm provenance and the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # no dependency cache in the job that holds id-token: write (cache poisoning)
          package-manager-cache: false
      - name: npm supports trusted publishing (11.5.1+, bundled with Node 24)
        run: |
          version=$(npm --version)
          oldest=$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)
          if [ "$oldest" != 11.5.1 ]; then echo "npm $version is older than 11.5.1"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - name: Pack and write the SBOM
        id: pack
        run: |
          mkdir release-assets
          pnpm pack --pack-destination release-assets
          pnpm sbom --sbom-format spdx --prod --out release-assets/code-guidelines.spdx.json
          echo "tarball=$(ls release-assets/*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish (skipped when the version already exists)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Unauthenticated registry read: setup-node's placeholder NODE_AUTH_TOKEN can make `npm view` fail.
        run: |
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@devenvy%2fcode-guidelines/$VERSION"; then
            echo "@devenvy/code-guidelines@$VERSION is already published; skipping."
          elif [[ "$VERSION" == *-* ]]; then
            npm publish "$TARBALL" --access public --tag next
          else
            npm publish "$TARBALL" --access public
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  # Attaches the published tarball and its SBOM to the GitHub release. Separate from publish so
  # the job that can write to the repository never holds id-token: write.
  release-assets:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
