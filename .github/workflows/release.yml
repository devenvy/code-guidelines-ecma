name: Release

# Publishing a GitHub release (tag vX.Y.Z on a commit on main) publishes that version: CI runs on
# the tag, then the package is packed with the tag's version, published to npm with trusted
# publishing, its tarball's build provenance is attested, and the tarball and an SPDX SBOM are
# attached to the release. A prerelease tag (v1.2.0-rc.1) publishes under the npm `next` dist-tag.
#
# If publishing fails because of this workflow, fix it on main, then run this workflow by hand from
# main with the release's tag: it runs CI (on main) and publishes the tag's code again (a version
# already on npm is skipped).
#
# The npm trusted publisher is bound to this file name (release.yml).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v2.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag must be a version on main; package.json's version is set from it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$TAG\" is not a release tag like v2.1.0"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write # ci.yml's test job declares it (used only for PR coverage comments)

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), npm provenance and the build attestation
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # no dependency cache in the job that holds id-token: write (cache poisoning)
          package-manager-cache: false
      - name: npm supports trusted publishing (11.5.1+, bundled with Node 24)
        run: |
          version=$(npm --version)
          oldest=$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)
          if [ "$oldest" != 11.5.1 ]; then echo "npm $version is older than 11.5.1"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - name: Set the version from the tag
        run: npm pkg set "version=$VERSION"
      - name: Pack and write the SBOM
        id: pack
        run: |
          mkdir release-assets
          pnpm pack --pack-destination release-assets
          pnpm sbom --sbom-format spdx --prod --out release-assets/code-guidelines.spdx.json
          # ./ prefix: npm publish reads "dir/file.tgz" as a GitHub owner/repo shorthand
          echo "tarball=$(ls ./release-assets/*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish (skipped when the version already exists)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Unauthenticated registry read: setup-node's placeholder NODE_AUTH_TOKEN can make `npm view` fail.
        run: |
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@devenvy%2fcode-guidelines/$VERSION"; then
            echo "@devenvy/code-guidelines@$VERSION is already published; skipping."
          elif [[ "$VERSION" == *-* ]]; then
            npm publish "$TARBALL" --access public --tag next
          else
            npm publish "$TARBALL" --access public
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  # Attaches the published tarball and its SBOM to the GitHub release. Separate from publish so
  # the job that can write to the repository never holds id-token: write.
  release-assets:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
